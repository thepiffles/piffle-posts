const NAMES={RoyalBunny:'RoyalBunny',Greywolf:'Greywolf'},COL={RoyalBunny:'var(--b)',Greywolf:'var(--w)'};

let cur='2026-11-08';

const tierOf=s=>{let last=0;for(let i=0;i<C.length;i++){if(C[i]==null)continue;last=i;if(s>=C[i]*(1-5e-4))return i}return last};

const ns=(t,x)=>document.createElementNS('http://www.w3.org/2000/svg',t);

 const S=D.sets[cur],box=document.getElementById('ledger');
 const n={};for(const g in S){n[g]=T.map(()=>0);n[g].push(0);S[g].forEach(p=>n[g][tierOf(p[1])]++)}
 const W=720,rowH=34,top=34,H=top+rowH*(T.length)+44,sz=12,gap=4,mid=360;

 const txt=(x,y,t,o={})=>{const e=ns('text');e.setAttribute('x',x);e.setAttribute('y',y);e.textContent=t;for(const k in o)e.setAttribute(k,o[k]);s.appendChild(e);return e};
 txt(mid-12,20,'RoyalBunny',{'text-anchor':'end',fill:COL.RoyalBunny,'font-size':15,style:'fill:var(--b)'});

 let tb=0,tw=0;
 T.forEach((t,i)=>{const y=top+i*rowH+rowH/2;txt(0,y+5,t+'k',{'font-style':'italic','font-size':17,'font-family':'Georgia,serif'});
  const a=n.RoyalBunny[i],b=n.Greywolf[i];tb+=a*t;tw+=b*t;
  for(let k=0;k<a;k++){const r=ns('rect');r.setAttribute('x',mid-12-(k+1)*(sz+gap)+gap);r.setAttribute('y',y-sz/2);r.setAttribute('width',sz);r.setAttribute('height',sz);r.setAttribute('rx',2);r.style.fill='var(--b)';s.appendChild(r)}

  const net=(a-b)*t/1000;const e=txt(W,y+5,(net>0?'+':'')+net.toFixed(2)+'M',{'text-anchor':'end','font-size':15});e.style.fill=net>0?'var(--pos)':net<0?'var(--neg)':'var(--mut)';

 const d=(tb-tw)/1000,e=txt(W,y,(d>0?'+':'')+d.toFixed(2)+'M',{'text-anchor':'end','font-size':16,'font-weight':600});e.style.fill=d>0?'var(--pos)':'var(--neg)';

function swarm(){
 const S=D.sets[cur],box=document.getElementById('swarm'),W=720,H=460,L=24,R=W-24,lo=Math.log10(60),hi=Math.log10(20000);
 const X=v=>L+(Math.log10(v)-lo)/(hi-lo)*(R-L),mid=H/2-10;
 const s=ns('svg');s.setAttribute('viewBox',`0 0 ${W} ${H}`);
 const add=(t,a,tx)=>{const e=ns(t);for(const k in a)e.setAttribute(k,a[k]);if(tx)e.textContent=tx;s.appendChild(e);return e};
 C.forEach((c,i)=>{if(c==null)return;const x=X(c);add('line',{x1:x,x2:x,y1:40,y2:H-40,style:'stroke:var(--line);stroke-dasharray:3 4'});add('text',{x,y:i%2?18:32,'text-anchor':'middle','font-size':12,style:'fill:var(--mut);font-style:italic'},T[i]+'k')});

 const rad=6.5,lab=[];
 ['RoyalBunny','Greywolf'].forEach((g,gi)=>{const dir=gi?1:-1,placed=[];
  [...S[g]].sort((a,b)=>a[1]-b[1]).forEach(p=>{const x=X(p[1]);let k=0,y;for(;;k++){const off=(k%2?1:-1)*Math.ceil(k/2)*0;y=mid+dir*(12+k*(rad*1.9));if(!placed.some(q=>Math.hypot(q[0]-x,q[1]-y)<rad*2.05))break}
   placed.push([x,y]);add('circle',{cx:x,cy:y,r:rad,style:`fill:var(${gi?'--w':'--b'});stroke:var(--bg);stroke-width:1.5`}).appendChild(Object.assign(ns('title'),{textContent:`${p[0]}: ${p[1].toLocaleString()}B`}));p.push(x,y)});
  [...S[g]].sort((a,b)=>b[1]-a[1]).slice(0,2).forEach(p=>add('text',{x:Math.min(p[2],R-30),y:p[3]+(dir*(rad+13)),'text-anchor':'middle','font-size':12},p[0]))});
