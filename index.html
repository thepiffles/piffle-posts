<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Piffle Posts</title>
<script>try{const t=localStorage.getItem("pp-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2.5' y='2.5' width='27' height='27' rx='3' fill='%23fbfafd' stroke='%231d1a24' stroke-width='1.5'/><polyline points='7,22 13,16 18,19 25,9' fill='none' stroke='%236a3fa8' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans+Condensed:wght@400;500&family=IBM+Plex+Mono&display=swap">
<style>
/* Same palette and type as the posts, so the site and a post read as one page. */
:root{
  --bg:#fbfafd; --fg:#1d1a24; --muted:#6a6474; --faint:#9a94a5; --rule:#e6e2ec; --rb:#6a3fa8; --panel-k:#fff6dc;
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --gutter:24px; --ease:cubic-bezier(.2,.75,.15,1); --pen:cubic-bezier(.65,0,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17151c; --fg:#ece8f2; --muted:#a39cae; --faint:#7a7385; --rule:#302b39; --rb:#a47cf5; --panel-k:#2c2836; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17151c; --fg:#ece8f2; --muted:#a39cae; --faint:#7a7385; --rule:#302b39; --rb:#a47cf5; --panel-k:#2c2836; color-scheme:dark}
@media (max-width:520px){:root{--gutter:16px}}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:18px/1.55 var(--serif);min-height:100vh}
[hidden]{display:none!important}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rb);outline-offset:3px}

/* the column matches a post's: 760px of text plus the post's own side padding */
.col{max-width:calc(760px + 2*var(--gutter));margin:0 auto}
.pad{padding-inline:var(--gutter)}
.sc{font-family:var(--ui);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* masthead */
.mast{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-top:40px;padding-bottom:12px}
.mast a.name{text-decoration:none;font-weight:500;font-size:21px;letter-spacing:-.005em}
.mast a.name i{font-weight:400}
.mast button{background:none;border:0;padding:7px 0 7px 12px;margin:-7px 0;cursor:pointer}
.mast button:hover,.back:hover{color:var(--fg)}
.mast-r{display:flex;align-items:center;gap:6px}

/* theme switch: a track with a sun and a moon; the cat is the knob and slides to the current mode */
.cat{position:relative;display:inline-block;width:52px;height:28px;padding:0;margin:-4px 0;border:1px solid var(--faint);border-radius:14px;background:var(--bg);cursor:pointer;flex:none;transition:border-color .3s}
.cat:hover{border-color:var(--fg)}
.cat svg{position:absolute;top:6px;width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.cat .sun{left:6px}.cat .moon{right:6px}
.cat .knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--panel-k);box-shadow:0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center;font-size:13px;line-height:1;transition:transform .45s var(--ease),background .45s}
.cat .knob span{display:inline-block;transition:filter .5s}
.cat:hover .knob{transform:translateX(2px)}
.cat[aria-checked="true"] .knob{transform:translateX(24px)}
.cat[aria-checked="true"]:hover .knob{transform:translateX(22px)}
.cat[aria-checked="true"] .knob span{filter:grayscale(1) brightness(.85) contrast(1.15)}
.cat.spin .knob span{animation:catflip .55s var(--ease)}
.gate-cat{position:absolute;top:22px;right:max(16px,calc(50% - 404px))}
.theming,.theming *,.theming *::before,.theming *::after{transition:background-color .45s ease,color .45s ease,border-color .45s ease!important}

/* signature */
.sig{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:13px;color:var(--muted);padding-top:8px;padding-bottom:44px}

/* index */
.intro{padding-top:44px;padding-bottom:8px}
.intro h1{font-weight:500;font-size:clamp(32px,6vw,44px);line-height:1.1;margin:0 0 10px}
.intro p{margin:0;font-size:20px;max-width:44ch;color:var(--fg)}
.month{margin:44px 0 0;font-style:italic;font-weight:400;font-size:18px;color:var(--muted)}
.entries{list-style:none;margin:10px 0 0;padding:0}
.entry{position:relative}
.entry .rule{--at:calc(var(--i,0)*90ms)}
.entry .rule.b{--at:calc(var(--i,0)*90ms + 250ms)}
.entry:not(:last-child) .rule.b{display:none}
.entry a{display:grid;grid-template-columns:7.5rem 1fr;gap:0 24px;padding:20px 0 22px;text-decoration:none}
.entry .meta{display:flex;flex-direction:column;gap:2px;padding-top:7px}
.entry h2{font-weight:500;font-size:25px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.entry h2 .t{background:linear-gradient(var(--rb),var(--rb)) no-repeat 0 100%/0 1px;padding-bottom:3px;transition:background-size .5s var(--ease)}
.entry h2 .arr{display:inline-block;margin-left:.3em;color:var(--rb);opacity:0;transform:translateX(-8px);transition:opacity .3s,transform .4s var(--ease)}
.entry .meta span:first-child{transition:color .3s}
.entry a:hover h2 .t,.entry a:focus-visible h2 .t{background-size:100% 1px}
.entry a:hover h2 .arr,.entry a:focus-visible h2 .arr{opacity:1;transform:none}
.entry a:hover .meta span:first-child{color:var(--fg)}
.entry p{margin:0;color:var(--muted);font-size:17px;max-width:58ch}
.new{color:var(--rb)}
.new::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--rb);margin-right:6px;vertical-align:2px;animation:pulse 2.4s ease-in-out infinite}
.empty{color:var(--muted);font-style:italic;margin-top:44px}
@media (max-width:600px){.entry a{grid-template-columns:1fr}.entry .meta{flex-direction:row;gap:12px;padding:0 0 6px}}

/* single post: the post brings its own title, so the shell stays out of the way */
.crumbs{display:flex;justify-content:space-between;gap:16px;padding-top:18px}
.back{text-decoration:none;display:inline-block;padding:5px 12px 5px 0;margin:-5px 0}
.back .a{display:inline-block;transition:transform .35s var(--ease)}
.back:hover .a{transform:translateX(-4px)}
.frame{display:block;width:100%;border:0;min-height:60vh;background:var(--bg);opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .9s var(--ease)}
.frame.ready{opacity:1;transform:none}
.pager{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding-top:16px;padding-bottom:40px;margin-top:8px}
.pager a{opacity:0}.pager.in a{animation:rise .7s .25s var(--ease) both}
.pager a .a{display:inline-block;transition:transform .35s var(--ease)}
.pager a:hover .a{transform:translateX(-4px)}.pager .next:hover .a{transform:translateX(4px)}
.pager a{text-decoration:none;display:flex;flex-direction:column;gap:2px}
.pager a:hover>span:last-child{text-decoration:underline;text-decoration-color:var(--rb);text-underline-offset:4px}
.pager .next{text-align:right;grid-column:2}
.pager a>span:last-child{font-family:var(--serif);font-size:18px;text-transform:none;letter-spacing:0;color:var(--fg)}

/* gate */
.gate{max-width:calc(30rem + 2*var(--gutter));margin:0 auto;padding:22vh var(--gutter) 40px}
.gate h1{font-weight:500;font-size:clamp(32px,7vw,44px);line-height:1.1;margin:0 0 10px}
.gate p{margin:0 0 30px;font-size:19px}
.field{position:relative;display:flex;align-items:baseline;gap:14px;padding-bottom:6px}
.field .rule::before{background:var(--fg)}
.field::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--rb);transform-origin:left;transform:scaleX(0);transition:transform .55s var(--ease)}
.field:focus-within::after{transform:scaleX(1)}
.field.bad{animation:shake .45s}
.field input{flex:1;min-width:0;border:0;background:none;font-size:20px;padding:2px 0;outline:none}
.field input::placeholder{color:var(--faint);font-style:italic}
.field button .a{display:inline-block;transition:transform .35s var(--ease)}
.field button:hover .a{transform:translateX(4px)}
.field button{background:none;border:0;padding:0;cursor:pointer;color:var(--rb);font-family:var(--ui);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.field button:disabled{color:var(--faint);cursor:wait}
.opts{display:flex;justify-content:space-between;gap:16px;margin-top:12px}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer}
.opts input{accent-color:var(--rb);margin:0}
.err{color:var(--rb);font-style:italic;font-size:16px;min-height:26px;margin-top:18px}
.err:not(:empty){animation:rise .4s var(--ease) both}
.gate.leaving{animation:leave .45s var(--ease) both}

/* ---------- motion ---------- */
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-16px)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes pulse{50%{opacity:.25}}
@keyframes catflip{45%{transform:scale(.55) rotate(-25deg)}}
.w{display:inline-block;animation:rise .8s var(--ease) both;animation-delay:calc(var(--d,0ms) + var(--i)*65ms)}
.rise{animation:rise .8s var(--ease) both;animation-delay:var(--d,0ms)}
.rv{opacity:0}
.rv.in{animation:rise .75s var(--ease) both;animation-delay:calc(var(--i)*90ms)}
/* rules are drawn like a pen stroke: the hairline grows behind a small ink tip that travels with it */
.rule{position:absolute;left:0;right:0;height:1px;pointer-events:none}
.rule::before{content:"";position:absolute;inset:0;background:var(--rule);transform-origin:left;transform:scaleX(0)}
.rule::after{content:"";position:absolute;top:-1.5px;left:0;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--fg);opacity:0}
.rule.go::before,.in .rule::before{animation:draw var(--dur,1.3s) var(--at,0s) var(--pen) both}
.rule.go::after,.in .rule::after{animation:pen var(--dur,1.3s) var(--at,0s) var(--pen) both,ink var(--dur,1.3s) var(--at,0s) linear both}
@keyframes pen{from{left:0}to{left:100%}}
@keyframes ink{0%{opacity:0}6%{opacity:.8}85%{opacity:.8}100%{opacity:0}}
::view-transition-old(root){animation:.25s ease both leave}
::view-transition-new(root){animation:.45s .1s var(--ease) both rise}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after,::view-transition-old(root),::view-transition-new(root){animation:none!important;transition:none!important}
  .rv,.frame,.pager a{opacity:1!important;transform:none!important}
  .rule::before{transform:none!important}.rule::after{display:none}
}
</style>
</head>
<body>

<form class="gate" id="gate" autocomplete="off">
  <button type="button" class="cat gate-cat" role="switch"><svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg><svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 10.1A5.6 5.6 0 0 1 5.9 2.8a5.6 5.6 0 1 0 7.3 7.3z"/></svg><span class="knob" aria-hidden="true"><span>🐱</span></span></button>
  <h1 data-words>Piffle Posts</h1>
  <p class="rise" style="--d:300ms">Guild newsletters for Royal Guilds, Luna 1.</p>
  <div class="field">
    <input id="pw" type="password" placeholder="Password" aria-label="Password" autofocus>
    <button id="go" type="submit">Enter <span class="a">→</span></button>
    <span class="rule go" style="bottom:0;--at:.45s"></span>
  </div>
  <div class="opts sc rise" style="--d:650ms"><label><input id="remember" type="checkbox" checked> Remember this device</label></div>
  <div class="err" id="err" role="alert"></div>
  <div class="sig rise" style="--d:900ms;margin-top:40px">Made possible by Luna 1 piffles 😺</div>
</form>

<div id="app" hidden>
  <header class="col pad"><div class="mast">
    <a class="name" href="#/">Piffle Posts</a>
    <div class="mast-r">
      <button type="button" class="cat" role="switch"><svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg><svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 10.1A5.6 5.6 0 0 1 5.9 2.8a5.6 5.6 0 1 0 7.3 7.3z"/></svg><span class="knob" aria-hidden="true"><span>🐱</span></span></button>
      <button type="button" class="sc" id="lock" title="Forget the password on this device">Lock</button>
    </div>
    <span class="rule go" style="bottom:0;--at:.15s;--dur:1.6s"></span>
  </div></header>
  <main id="view"></main>
  <footer class="sig col pad">Made possible by Luna 1 piffles 😺</footer>
</div>

<!-- Added to every post: its charts draw themselves like a pen, the first time each one scrolls into view.
     Grid lines are ruled first, then each data line is inked with a small tip riding its end, and dots and
     labels appear as the pen passes. Posts need nothing special for this. -->
<script type="text/plain" id="pen-src">
(()=>{
if(matchMedia("(prefers-reduced-motion: reduce)").matches||!window.IntersectionObserver) return;
const NS="http://www.w3.org/2000/svg";
const st=document.createElement("style"); st.textContent=".pen-wait>svg{visibility:hidden}"; document.head.appendChild(st);
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const inked=e=>{ const c=getComputedStyle(e); return c.stroke!=="none"&&c.visibility!=="hidden"&&parseFloat(c.strokeWidth)>0&&(c.strokeDasharray==="none"||!c.strokeDasharray); };

function draw(box){
  const svg=box.querySelector(":scope>svg"); if(!svg) return 0;
  box.classList.remove("pen-wait");
  const R=svg.getBoundingClientRect(), W=R.width||1;
  const relX=e=>{ const r=e.getBoundingClientRect(); return Math.min(1,Math.max(0,(r.left+r.width/2-R.left)/W)); };
  const lines=[...svg.querySelectorAll("path,line,polyline")].filter(e=>!e.closest("defs,clipPath")&&inked(e));
  const ruled=e=>{ if(e.tagName!=="line") return false; const b=e.getBBox(); return b.width<.5||(b.height<.5&&b.width>W*.5); };
  const grid=lines.filter(ruled), data=lines.filter(e=>!ruled(e));
  const tasks=[];
  grid.forEach((e,i)=>tasks.push({e,start:i*30,dur:600}));
  const g0=grid.length?Math.min(420,grid.length*30)+180:0;
  const step=data.length>1?Math.min(240,1300/data.length):0;
  data.forEach((e,i)=>{ const len=e.getTotalLength(); tasks.push({e,start:g0+i*step,dur:Math.min(1600,550+len*1.1),tip:len>90}); });
  const end=Math.max(g0+600,...tasks.map(k=>k.start+k.dur));
  for(const k of tasks){
    k.len=k.e.getTotalLength()+1;
    k.e.style.strokeDasharray=k.len; k.e.style.strokeDashoffset=k.len;
    if(k.tip){
      k.dot=document.createElementNS(NS,"circle");
      k.dot.setAttribute("r",2.3); k.dot.setAttribute("fill",getComputedStyle(k.e).stroke);
      if(k.e.getAttribute("clip-path")) k.dot.setAttribute("clip-path",k.e.getAttribute("clip-path"));
      k.dot.style.cssText="opacity:0;pointer-events:none";
      k.e.parentNode.appendChild(k.dot);
    }
  }
  // dots and labels appear as the pen sweeps across
  svg.querySelectorAll("circle,text").forEach(e=>{
    if(e.closest("defs")||tasks.some(k=>k.dot===e)||getComputedStyle(e).visibility==="hidden") return;
    e.animate([{opacity:0},{opacity:1}],{duration:e.tagName==="text"?500:320,delay:g0+relX(e)*(end-g0)*.85,fill:"backwards",easing:"ease-out"});
  });
  const t0=performance.now();
  (function frame(now){
    let live=false;
    for(const k of tasks){
      if(k.done||!k.e.isConnected) continue;
      const p=Math.min(1,Math.max(0,(now-t0-k.start)/k.dur)), q=ease(p);
      k.e.style.strokeDashoffset=k.len*(1-q);
      if(k.dot){
        if(p>0&&p<1){ const pt=k.e.getPointAtLength(Math.min(k.len-1,k.len*q)); k.dot.setAttribute("cx",pt.x); k.dot.setAttribute("cy",pt.y); k.dot.style.opacity=.9; }
        else k.dot.style.opacity=0;
      }
      if(p<1) live=true;
      else{ k.done=true; k.e.style.strokeDasharray=""; k.e.style.strokeDashoffset=""; if(k.dot) k.dot.remove(); }
    }
    if(live) requestAnimationFrame(frame);
  })(t0);
  return end;
}

const boxes=[...new Set([...document.querySelectorAll("svg")]
  .filter(s=>!s.closest("td,th,button,a,label")&&s.getBoundingClientRect().width>=200)
  .map(s=>s.parentElement))];
const state=new Map();
const io=new IntersectionObserver(es=>{
  for(const e of es){ if(!e.isIntersecting) continue; io.unobserve(e.target);
    state.set(e.target,performance.now()+draw(e.target)+80); }
},{threshold:.25});
boxes.forEach(b=>{
  b.classList.add("pen-wait"); io.observe(b);
  // posts redraw charts on resize or when fonts load; if that happens mid-stroke, start the stroke again
  new MutationObserver(()=>{ const until=state.get(b); if(until&&performance.now()<until) state.set(b,performance.now()+draw(b)+80); })
    .observe(b,{childList:true});
});
})();
</script>

<script>
const BOX={"salt":"piffle-posts-v1","iter":250000,"iv":"cQcSCdvdVFMy+jYu","ct":"4+un57K7asrpVAC86/xrkpqJ/eM6gQFpPyLKNmfWD/Fo12Z8GyBeJCIoAjDbTWQOi+R3kNa2BlWjNkOSFJamrEiyupq2Rx+0pW6Iueq26NGXspHLUUIPQoIUNFh4ThzTRfIPN0+NuzoEpI/t4TKs6Mk6LzWW9ZmjuUMT2KPEEVQ3+kSgmRMBiwugjjkEr1ZJVER1g/KRNRtHFFRUB9m88yBAsDTsu4uVTe88JN5xw0Sj8IcfDvg1Xhmz6wwoXYHT4xV8itQ0YkAQ6m9I3CMvEpR3xR6NgT66SBUmQWQzTnsev3hcS06yalBY26efEQHkSiJ9bfWfRxNrfOCmsMyKKhU="};
const SAVED="pp-key";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dec=new TextDecoder(), enc=new TextEncoder();
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let KEY=null, POSTS=[];
const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCE?0:ms));
// split a heading into words that rise one after another
function words(el,delay=0){
  el.style.setProperty("--d",delay+"ms");
  el.innerHTML=el.textContent.trim().split(/\s+/).map((w,i)=>`<span class="w" style="--i:${i}">${esc(w)}</span>`).join(" ");
}
document.querySelectorAll("[data-words]").forEach(el=>words(el));
if(store.get("pp-key")) document.getElementById("gate").hidden=true;   // remembered: skip the gate

async function deriveRaw(pw){
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(BOX.salt),iterations:BOX.iter,hash:"SHA-256"},base,256));
}
const toKey=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
async function open(box,key){ return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct))); }

async function unlock(raw,remember,fromGate){
  const key=await toKey(raw);
  POSTS=JSON.parse(await open(BOX,key));   // throws on a wrong password
  KEY=key;
  if(remember) store.set(SAVED,btoa(String.fromCharCode(...raw)));
  const gate=document.getElementById("gate");
  if(fromGate){ gate.classList.add("leaving"); await wait(420); }
  gate.hidden=true;
  document.getElementById("app").hidden=false;
  route();
}

document.getElementById("gate").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("go"), err=document.getElementById("err");
  btn.disabled=true; err.textContent="";
  try{ await unlock(await deriveRaw(document.getElementById("pw").value),document.getElementById("remember").checked,true); }
  catch(x){
    err.textContent="Not quite. Ask in guild chat.";
    const f=document.querySelector(".field"); f.classList.remove("bad"); void f.offsetWidth; f.classList.add("bad");
    document.getElementById("pw").select();
  }
  btn.disabled=false;
});
document.getElementById("lock").onclick=()=>{ store.del(SAVED); location.hash=""; location.reload(); };

// ---------- views ----------
const day=d=>new Date(d+"T12:00:00");
const fmtDate=d=>day(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const fmtMonth=d=>day(d).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
const isNew=d=>(Date.now()-day(d))/864e5<7;
const href=p=>"#/"+encodeURIComponent(p.slug);
const view=document.getElementById("view");

function entry(p){
  return `<li class="entry rv"><span class="rule" style="top:0"></span><span class="rule b" style="bottom:0"></span><a href="${href(p)}">
    <div class="meta sc"><span>${fmtDate(p.date)}</span>${p.tag?`<span>${esc(p.tag)}</span>`:""}${isNew(p.date)?`<span class="new">New</span>`:""}</div>
    <div><h2><span class="t">${esc(p.title)}</span><span class="arr" aria-hidden="true">→</span></h2><p>${esc(p.summary)}</p></div>
  </a></li>`;
}

function listView(){
  document.title="Piffle Posts";
  const months=[];
  for(const p of POSTS){ const m=fmtMonth(p.date); if(!months.length||months.at(-1).m!==m) months.push({m,ps:[]}); months.at(-1).ps.push(p); }
  view.className="col pad";
  view.innerHTML=`<section class="intro"><h1 data-words>Notes from the guild</h1>
    <p class="rise" style="--d:380ms">Weekly newsletters and data breakdowns for Royal Guilds, Luna 1.</p></section>
    ${months.length?months.map(g=>`<h2 class="month rise" style="--d:560ms">${g.m}</h2><ul class="entries">${g.ps.map(entry).join("")}</ul>`).join(""):`<p class="empty">Nothing posted yet.</p>`}
    <div style="height:48px"></div>`;
  words(view.querySelector("[data-words]"),150);
  reveal(view.querySelectorAll(".rv"),650);
}

// entries rise and their rules draw as they scroll into view, a few at a time
let io;
function reveal(els,firstDelay){
  io&&io.disconnect();
  let batch=0, t=null, first=true;
  io=new IntersectionObserver(es=>{
    for(const e of es){ if(!e.isIntersecting) continue;
      e.target.style.setProperty("--i",batch++ + (first?firstDelay/90:0));
      e.target.classList.add("in"); io.unobserve(e.target); }
    clearTimeout(t); t=setTimeout(()=>{batch=0;first=false},120);
  },{rootMargin:"0px 0px -8% 0px"});
  els.forEach(el=>io.observe(el));
}

async function postView(slug){
  const i=POSTS.findIndex(x=>x.slug===slug), p=POSTS[i];
  if(!p){ location.hash="#/"; return; }
  document.title=p.title+" · Piffle Posts";
  const newer=POSTS[i-1], older=POSTS[i+1];   // POSTS is newest first
  view.className="col";
  view.innerHTML=`<div class="crumbs pad sc rise"><a class="back" href="#/"><span class="a">←</span> All posts</a><span>${fmtDate(p.date)}</span></div>
    <iframe class="frame" title="${esc(p.title)}" scrolling="no"></iframe>
    <nav class="pad"><div class="pager sc"><span class="rule" style="top:0"></span>
      ${older?`<a href="${href(older)}"><span><span class="a">←</span> Older</span><span>${esc(older.title)}</span></a>`:""}
      ${newer?`<a class="next" href="${href(newer)}"><span>Newer <span class="a">→</span></span><span>${esc(newer.title)}</span></a>`:""}
      ${!older&&!newer?`<a href="#/"><span>That's the latest</span><span>Back to all posts</span></a>`:""}
    </div></nav>`;
  window.scrollTo(0,0);
  const frame=view.querySelector("iframe");
  try{
    const box=await (await fetch(`p/${encodeURIComponent(slug)}.json`,{cache:"no-cache"})).json();
    let html=await open(box,KEY);
    frame.addEventListener("load",()=>{
      const d=frame.contentDocument; if(!d) return;
      if(root.dataset.theme) d.documentElement.dataset.theme=root.dataset.theme;   // in case the theme changed while loading
      d.querySelectorAll("a[href^='http']").forEach(a=>a.target="_blank");
      const fit=()=>{ frame.style.height=d.documentElement.scrollHeight+"px"; };
      fit(); new ResizeObserver(fit).observe(d.body); setTimeout(fit,600);
      requestAnimationFrame(()=>frame.classList.add("ready"));
      const pager=view.querySelector(".pager");
      if(pager){ const po=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ pager.classList.add("in"); po.disconnect(); } }); po.observe(pager); }
    },{once:true});
    const th=document.documentElement.dataset.theme;
    if(th) html=html.replace(/<html([^>]*)>/i,(m,a)=>`<html${a} data-theme="${th}">`);
    const pen=`<script>${document.getElementById("pen-src").textContent}<\/script>`;
    frame.srcdoc=/<\/body>/i.test(html)?html.replace(/<\/body>(?![\s\S]*<\/body>)/i,()=>pen+"</body>"):html+pen;
  }catch(e){ frame.replaceWith(Object.assign(document.createElement("p"),{className:"empty pad",textContent:"Couldn't load this post. Try refreshing."})); }
}

// ---------- theme ----------
const root=document.documentElement;
const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
function syncCats(){
  const dk=isDark();
  document.querySelectorAll(".cat").forEach(b=>{ b.setAttribute("aria-checked",dk); b.title=dk?"Switch to light mode":"Switch to dark mode"; b.setAttribute("aria-label","Dark mode"); });
}
function setTheme(t){
  root.classList.add("theming"); root.dataset.theme=t; store.set("pp-theme",t); syncCats();
  const f=document.querySelector(".frame"); if(f&&f.contentDocument&&f.contentDocument.documentElement) f.contentDocument.documentElement.dataset.theme=t;
  clearTimeout(setTheme.t); setTheme.t=setTimeout(()=>root.classList.remove("theming"),500);
}
document.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>{
  b.classList.remove("spin"); void b.offsetWidth; b.classList.add("spin");
  setTheme(isDark()?"light":"dark");
}));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncCats);
syncCats();

function render(){
  const slug=decodeURIComponent(location.hash.replace(/^#\/?/,""));
  return slug?postView(slug):listView();
}
let shown=false;
function route(){
  if(!KEY) return;
  // cross-fade between pages where the browser supports view transitions
  if(shown&&document.startViewTransition&&!REDUCE) document.startViewTransition(render);
  else render();
  shown=true;
}
addEventListener("hashchange",route);

// remembered login
(async()=>{
  const s=store.get(SAVED);
  if(s){ try{ await unlock(unb64(s),false); }catch(e){ store.del(SAVED); } }
})();
</script>
